<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — MDHub4u</title>
    <style>
        :root {
            --bg: #070b12; /* Home page matching main dark background */
            --header: #0b0f17;
            --primary: #159CFF;
            --primary-glow: rgba(21, 156, 255, 0.35);
            --card-bg: #0b0f17; /* Home page card background */
            --card-border: #161f2e;
            --card-border-glow: rgba(21, 156, 255, 0.4);
            --text: #FFFFFF;
            --text-secondary: #94A3B8;
            --muted: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.08) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* HEADER MATCHING HOME PAGE */
        header {
            background: #0b0f17;
            border-bottom: 1px solid #161f2e;
            padding: 14px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        /* LOGO: MD Red, Hub4u White matching home page */
        .logo {
            color: #ff0000;
            text-decoration: none;
            font-size: 30px;
            font-weight: 800;
        }

        .logo span {
            color: #ffffff;
        }

        .menu-btn {
            display: block;
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            padding: 5px 10px;
        }

        nav {
            display: none;
            position: absolute;
            top: 65px;
            right: 6%;
            flex-direction: column;
            gap: 0;
            background: #0b0f17;
            border: 1px solid #1a2638;
            border-radius: 8px;
            padding: 10px;
            min-width: 160px;
            z-index: 999;
        }

        nav.show {
            display: flex;
        }

        nav a {
            padding: 10px 12px;
            color: #c9d8e9;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover,
        nav a.active {
            color: #ff0000;
        }

        .contact-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px 48px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .hero-card {
            position: relative;
            overflow: hidden;
        }

        .hero-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #ff0000, transparent);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.25);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 600;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 14px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255, 0, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        .hero-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #FFFFFF;
        }

        .hero-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease;
        }

        .action-btn:hover {
            border-color: #23324a;
            background: #0f1724;
            transform: translateY(-2px);
        }

        .action-icon {
            font-size: 1.2rem;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.2);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .action-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .action-label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
        }

        .action-value {
            font-size: 0.8rem;
            color: var(--text);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .form-card h2 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-field {
            width: 100%;
            padding: 13px 16px;
            background-color: #070b12;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-field:focus {
            border-color: #ff0000;
            background-color: #0b0f17;
            box-shadow: 0 0 0 4px rgba(255, 0, 0, 0.2);
        }

        .input-field::placeholder {
            color: var(--muted);
        }

        textarea.input-field {
            resize: none;
            height: 110px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff0000 0%, #b30000 100%);
            color: var(--text);
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.3);
        }

        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">
            MD<span>Hub4u</span>
        </a>

        <button class="menu-btn" onclick="toggleMenu()">☰</button>

        <nav class="nav-links" id="navMenu">
            <a href="index.html">Home</a>
            <a href="blog.html">Blog</a>
            <a href="disclaimer.html">Disclaimer</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="contact-wrapper">
        
        <section class="glass-card hero-card">
            <div class="badge">
                <span class="pulse-dot"></span>
                Secure Connection
            </div>
            <h1>Let's Build Something Exceptional</h1>
            <p>Have project inquiries, collaborations, or questions? Send us a note or connect instantly via our official channels.</p>
        </section>

        <div class="action-grid">
            <a href="https://instagram.com/digitora.studio" target="_blank" class="action-btn">
                <div class="action-icon">📸</div>
                <div class="action-info">
                    <span class="action-label">Instagram</span>
                    <span class="action-value">@digitora.studio</span>
                </div>
            </a>

            <a href="mailto:crazy.x44fku@bumpmail.io" class="action-btn">
                <div class="action-icon">✉️</div>
                <div class="action-info">
                    <span class="action-label">Direct Mail</span>
                    <span class="action-value">Send Mail</span>
                </div>
            </a>
        </div>

        <section class="glass-card form-card">
            <h2>Send a Message</h2>
            <form id="contactForm" onsubmit="sendEmail(event)">
                <div class="input-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" class="input-field" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input-field" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" class="input-field" placeholder="Tell us about your requirements..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
     
    </main>

    <script>
        function sendEmail(event) {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            const recipient = "crazy.x44fku@bumpmail.io";
            const subject = encodeURIComponent(`New Message from ${name} via MDHub4u`);
            const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`);
            
            window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
        }

        function toggleMenu() {
            document.getElementById("navMenu").classList.toggle("show");
        }
    </script>
  
</body>
</html>
